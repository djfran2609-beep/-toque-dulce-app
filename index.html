    {id:'p_matilda',name:'Matilda',active:true,businessPrice:5500,publicPrice:null,notes:'Receta pendiente de completar.',recipe:[...pack]}
  ];
  const weekId = uid('week');
  return {
    version:1,
    settings:{businessPrice:5000,publicPrice:7000},
    ingredients,
    products,
    businesses:[],
    weeks:[{id:weekId,label:weekLabel(),startDate:todayISO(),status:'open',orders:[],ownProduction:{},publicSales:[],productionStatus:{}}],
    currentWeekId:weekId
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : seedState();
    if(!state || !state.products || !state.weeks) throw new Error('Datos inválidos');
  } catch(e) {
    console.warn(e);
    state = seedState();
  }
  saveState(false);
}
function saveState(render=true){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); if(render) render(); }
function currentWeek(){ return state.weeks.find(w=>w.id===state.currentWeekId) || state.weeks.find(w=>w.status==='open') || state.weeks[0]; }
function product(id){ return state.products.find(p=>p.id===id); }
function ingredient(id){ return state.ingredients.find(i=>i.id===id); }
function business(id){ return state.businesses.find(b=>b.id===id); }
function priceOf(p, channel){ return n(channel==='business' ? (p.businessPrice ?? state.settings.businessPrice) : (p.publicPrice ?? state.settings.publicPrice)); }
function activeProducts(){ return state.products.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name)); }

function orderQtyTotal(order){ return order.items.reduce((s,i)=>s+n(i.qty),0); }
function orderMoney(order){ return order.items.reduce((s,i)=>s+n(i.qty)*n(i.unitPrice),0); }
function businessTotals(week=currentWeek()){
  return {qty:week.orders.reduce((s,o)=>s+orderQtyTotal(o),0), money:week.orders.reduce((s,o)=>s+orderMoney(o),0)};
}
function ownTotals(week=currentWeek()){
  let qty=0, value=0;
  Object.entries(week.ownProduction||{}).forEach(([pid,v])=>{ qty+=n(v.qty); value+=n(v.qty)*n(v.unitPrice ?? priceOf(product(pid)||{},'public')); });
  return {qty,value};
}
function salesTotals(week=currentWeek()) { return {qty:week.publicSales.reduce((s,x)=>s+n(x.qty),0),money:week.publicSales.reduce((s,x)=>s+n(x.qty)*n(x.unitPrice),0)}; }
function stockByProduct(week=currentWeek()){
  const out={};
  Object.entries(week.ownProduction||{}).forEach(([pid,v])=>out[pid]=n(v.qty));
  week.publicSales.forEach(s=>out[s.productId]=(out[s.productId]||0)-n(s.qty));
  return out;
}
function productionByProduct(week=currentWeek()){
  const out={};
  week.orders.forEach(o=>o.items.forEach(i=>out[i.productId]=(out[i.productId]||0)+n(i.qty)));
  Object.entries(week.ownProduction||{}).forEach(([pid,v])=>out[pid]=(out[pid]||0)+n(v.qty));
  return out;
}
function productionSources(pid,week=currentWeek()){
  const rows=[];
  week.orders.forEach(o=>{
    const item=o.items.find(i=>i.productId===pid);
    if(item && n(item.qty)>0) rows.push({name:business(o.businessId)?.name || 'Negocio',qty:n(item.qty)});
  });
  const own=n(week.ownProduction?.[pid]?.qty);
  if(own) rows.push({name:'Venta al público',qty:own});
  return rows;
}
function ingredientsNeeded(week=currentWeek()){
  const production=productionByProduct(week), totals={};
  Object.entries(production).forEach(([pid,q])=>{
    const p=product(pid); if(!p) return;
    (p.recipe||[]).forEach(r=>{ totals[r.ingredientId]=(totals[r.ingredientId]||0)+n(r.qty)*n(q); });
  });
  return totals;
}

function ensureOpenWeek(){ if(currentWeek()?.status!=='open'){ showToast('La semana está cerrada. Creá una nueva.'); return false; } return true; }

function showToast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function copyText(text){
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>showToast('Copiado')).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Copiado'); }
function closeModal(){ $('.modal-backdrop')?.remove(); }
function modal(title, body, opts={}){
  closeModal();
  const wrap=document.createElement('div'); wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="close-btn" onclick="closeModal()">✕</button></div>${body}</div>`;
  wrap.addEventListener('click',e=>{ if(e.target===wrap && !opts.locked) closeModal(); });
  document.body.appendChild(wrap); return wrap;
}
function go(view){ currentView=view; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){

        ${navBtn('public','🛍️','Público')}

}
function navBtn(view,ico,label){ return `<button class="nav-btn ${currentView===view?'active':''}" onclick="go('${view}')"><span>${ico}</span>${label}</button>`; }
function hero(title,sub='',right=''){ return `<div class="hero"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`; }

function renderView(){
  switch(currentView){
    case 'orders': return renderOrders();
    case 'production': return renderProduction();
    case 'own': return renderOwn();
    case 'public': return renderPublic();
    case 'businesses': return renderBusinesses();

      <div class="card stat-card"><div><div class="eyebrow">Producción total</div><div class="value">${prodQty}</div></div><div class="sub">postres a fabricar</div></div>
      <div class="card stat-card"><div><div class="eyebrow">Producción propia</div><div class="value">${ot.qty}</div></div><div class="sub">Potencial ${money(ot.value)}</div></div>
      <div class="card stat-card"><div><div class="eyebrow">Venta público</div><div class="value">${money(st.money)}</div></div><div class="sub">${st.qty} vendidos · ${stock} en stock</div></div>
    </div>
    <div class="section"><div class="section-title"><h3>Accesos rápidos</h3></div><div class="action-grid">
      ${action('🗓️','Nueva semana','Cerrar y empezar otra',"openNewWeekModal()")}

      ${action('🍓','Producción propia','Lo que venden ustedes',"go('own')")}
      ${action('📋','Lista de producción','Suma negocios + público',"go('production')")}
      ${action('✅','Modo producción','Marcar lo terminado',"go('productionMode')")}
      ${action('🛒','Ingredientes','Qué necesitás preparar',"go('shopping')")}
      ${action('🏪','Negocios','Clientes y datos',"go('businesses')")}
      ${action('🍰','Postres','Precios y recetas',"go('products')")}
      ${action('📚','Historial','Semanas anteriores',"go('history')")}
    </div></div>
    <div class="section"><div class="section-title"><h3>Facturación real</h3></div>

    </div>`;
}
function action(ico,title,sub,on,extra=''){ return `<button class="action-card ${extra}" onclick="${on}"><div class="ico">${ico}</div><strong>${esc(title)}</strong><small>${esc(sub)}</small></button>`; }

function renderOrders(){
  const w=currentWeek(), bt=businessTotals(w);
  const rows=w.orders.length ? w.orders.map(o=>{
    const b=business(o.businessId); return `<div class="list-item clickable" onclick="showOrder('${o.id}')"><div class="grow"><strong>${esc(b?.name||'Negocio')}</strong><small>${orderQtyTotal(o)} postres</small></div><div class="amount">${money(orderMoney(o))}</div><span>›</span></div>`;
  }).join('') : `<div class="empty"><div class="icon">🧾</div><strong>Todavía no cargaste pedidos</strong><div>Agregá el primer negocio de esta semana.</div></div>`;
  return `${hero('Pedidos','Pedidos de negocios de la semana')}
    <div class="total-box"><div class="label">Total a cobrar</div><div class="big">${money(bt.money)}</div><div class="meta">${bt.qty} postres · ${w.orders.length} negocios</div></div>
    <div class="section"><div class="section-title"><h3>Negocios</h3><button class="btn small ghost" onclick="openOrderModal()">+ Pedido</button></div><div class="list">${rows}</div></div>
    <button class="fab" onclick="openOrderModal()">＋ Nuevo pedido</button>`;
}

function openOrderModal(orderId=null){
  if(!ensureOpenWeek()) return;
  const w=currentWeek();
  if(!state.businesses.filter(b=>b.active).length){
    modal('Primero agregá un negocio',`<div class="empty"><div class="icon">🏪</div><strong>No hay negocios activos</strong><div>Creá un negocio y después cargá el pedido.</div></div><button class="btn primary wide" onclick="closeModal();go('businesses');openBusinessModal()">Agregar negocio</button>`); return;
  }
  const order=orderId?w.orders.find(o=>o.id===orderId):null;
  const bOptions=state.businesses.filter(b=>b.active || b.id===order?.businessId).map(b=>`<option value="${b.id}" ${b.id===order?.businessId?'selected':''}>${esc(b.name)}</option>`).join('');
  const items={}; (order?.items||[]).forEach(i=>items[i.productId]=i);
  const rows=activeProducts().map(p=>{
    const old=items[p.id]; const pr=old?n(old.unitPrice):priceOf(p,'business');
    return `<div class="qty-row"><div class="qty-name"><strong>${esc(p.name)}</strong><small>${money(pr)} c/u</small></div><input class="qty-input order-qty" data-pid="${p.id}" data-price="${pr}" type="number" min="0" step="1" value="${old?.qty||''}" oninput="updateOrderModalTotal()"><div class="subtotal" id="sub_${p.id}">${old?.qty?money(n(old.qty)*pr):'—'}</div></div>`;
  }).join('');
  modal(order?'Editar pedido':'Nuevo pedido',`
    <div class="field"><label>Negocio</label><select id="orderBusiness" class="select">${bOptions}</select></div>
    <div class="card" style="padding:10px 13px">${rows}</div>
    <div class="section"><div class="total-box"><div class="label">Total a cobrar</div><div class="big" id="orderModalMoney">${money(order?orderMoney(order):0)}</div><div class="meta" id="orderModalQty">${order?orderQtyTotal(order):0} postres</div></div></div>
    <div class="form-row section"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOrder('${orderId||''}')">Guardar pedido</button></div>`);
  updateOrderModalTotal();
}
function updateOrderModalTotal(){
  let q=0,m=0; $$('.order-qty').forEach(inp=>{ const qty=int(inp.value), pr=n(inp.dataset.price); q+=qty; m+=qty*pr; const s=$(`#sub_${inp.dataset.pid}`); if(s)s.textContent=qty?money(qty*pr):'—'; });
  if($('#orderModalMoney')) $('#orderModalMoney').textContent=money(m); if($('#orderModalQty')) $('#orderModalQty').textContent=`${q} postres`;
}
function saveOrder(orderId=''){
  const w=currentWeek(), businessId=$('#orderBusiness').value;
  const items=$$('.order-qty').map(inp=>({productId:inp.dataset.pid,qty:int(inp.value),unitPrice:n(inp.dataset.price)})).filter(x=>x.qty>0);
  if(!items.length){ showToast('Cargá al menos un postre'); return; }
  let order=orderId?w.orders.find(o=>o.id===orderId):w.orders.find(o=>o.businessId===businessId);
  if(order){ order.businessId=businessId; order.items=items; order.updatedAt=new Date().toISOString(); }
  else w.orders.push({id:uid('order'),businessId,items,createdAt:new Date().toISOString()});
  saveState(false); closeModal(); render(); showToast('Pedido guardado');
}
function showOrder(orderId){
  const w=currentWeek(), o=w.orders.find(x=>x.id===orderId); if(!o)return; const b=business(o.businessId);
  const rows=o.items.map(i=>`<div class="money-line"><span>${i.qty} × ${esc(product(i.productId)?.name||'Postre')} · ${money(i.unitPrice)}</span><strong>${money(i.qty*i.unitPrice)}</strong></div>`).join('');
  modal(b?.name||'Pedido',`${rows}<div class="divider"></div><div class="total-box"><div class="label">Total a cobrar</div><div class="big">${money(orderMoney(o))}</div><div class="meta">${orderQtyTotal(o)} postres</div></div><div class="grid grid-2 section"><button class="btn ghost" onclick="copyOrderSummary('${o.id}')">📋 Copiar resumen</button><button class="btn ghost" onclick="closeModal();openOrderModal('${o.id}')">✏️ Editar</button><button class="btn ghost" onclick="duplicateOrder('${o.id}')">⧉ Duplicar</button><button class="btn danger" onclick="deleteOrder('${o.id}')">Eliminar</button></div>`);
}
function copyOrderSummary(id){ const o=currentWeek().orders.find(x=>x.id===id); if(!o)return; const b=business(o.businessId); const lines=[`Pedido ${b?.name||''}`,'',...o.items.map(i=>`${i.qty} ${product(i.productId)?.name||'Postres'}`),'',`Total: ${orderQtyTotal(o)} postres`,`Total a pagar: ${money(orderMoney(o))}`]; copyText(lines.join('\n')); }
function duplicateOrder(id){ const w=currentWeek(), o=w.orders.find(x=>x.id===id); if(!o)return; w.orders.push({...JSON.parse(JSON.stringify(o)),id:uid('order'),createdAt:new Date().toISOString()}); saveState(false); closeModal(); render(); showToast('Pedido duplicado'); }
function deleteOrder(id){ if(!confirm('¿Eliminar este pedido?'))return; const w=currentWeek(); w.orders=w.orders.filter(o=>o.id!==id); saveState(false); closeModal(); render(); showToast('Pedido eliminado'); }

function renderProduction(){
  const w=currentWeek(), prod=productionByProduct(w), entries=Object.entries(prod).filter(([,q])=>q>0).sort((a,b)=>(product(a[0])?.name||'').localeCompare(product(b[0])?.name||''));
  const total=entries.reduce((s,[,q])=>s+n(q),0);
  const rows=entries.length?entries.map(([pid,q])=>`<div class="list-item clickable" onclick="showProductionDetail('${pid}')"><div class="grow"><strong>${esc(product(pid)?.name||'Postre')}</strong><small>Tocá para ver de dónde sale</small></div><div class="amount" style="font-size:24px">${qtyFmt(q)}</div><span>›</span></div>`).join(''):`<div class="empty"><div class="icon">🍮</div><strong>No hay producción cargada</strong><div>Cargá pedidos o producción propia.</div></div>`;
  return `${hero('Producción total','Negocios + producción propia')}
    <div class="total-box"><div class="label">Total a fabricar</div><div class="big">${total} postres</div><div class="meta">${entries.length} variedades</div></div>
    <div class="section"><div class="section-title"><h3>Por variedad</h3><button class="btn small ghost" onclick="go('productionMode')">Modo producción</button></div><div class="list">${rows}</div></div>
    <div class="section grid grid-2"><button class="btn ghost" onclick="go('own')">＋ Producción propia</button><button class="btn primary" onclick="go('shopping')">🛒 Ingredientes</button></div>`;
}
function showProductionDetail(pid){ const rows=productionSources(pid).map(r=>`<div class="money-line"><span>${esc(r.name)}</span><strong>${qtyFmt(r.qty)}</strong></div>`).join(''); const total=productionByProduct()[pid]||0; modal(product(pid)?.name||'Postre',`${rows}<div class="divider"></div><div class="total-box"><div class="label">Total</div><div class="big">${qtyFmt(total)}</div></div>`); }

function renderOwn(){
  const w=currentWeek(), rows=activeProducts().map(p=>{
    const v=w.ownProduction?.[p.id], pr=n(v?.unitPrice ?? priceOf(p,'public'));
    return `<div class="qty-row"><div class="qty-name"><strong>${esc(p.name)}</strong><small>${money(pr)} potencial c/u</small></div><input class="qty-input own-qty" data-pid="${p.id}" data-price="${pr}" type="number" min="0" step="1" value="${v?.qty||''}" oninput="updateOwnTotal()"><div class="subtotal" id="ownsub_${p.id}">${v?.qty?money(n(v.qty)*pr):'—'}</div></div>`;
  }).join('');
  const ot=ownTotals(w);
  return `${hero('Producción propia','Postres que hacen para vender ustedes')}
    <div class="note">Esto no cuenta como facturación real hasta que registres la venta al público.</div>
    <div class="section card" style="padding:10px 13px">${rows}</div>
    <div class="section total-box"><div class="label">Valor potencial</div><div class="big" id="ownMoney">${money(ot.value)}</div><div class="meta" id="ownQty">${ot.qty} postres</div></div>
    <button class="btn primary wide section" onclick="saveOwnProduction()">Guardar producción propia</button>`;
}
function updateOwnTotal(){ let q=0,m=0; $$('.own-qty').forEach(inp=>{const qty=int(inp.value),pr=n(inp.dataset.price);q+=qty;m+=qty*pr;const el=$(`#ownsub_${inp.dataset.pid}`);if(el)el.textContent=qty?money(qty*pr):'—';}); if($('#ownMoney'))$('#ownMoney').textContent=money(m);if($('#ownQty'))$('#ownQty').textContent=`${q} postres`; }
function saveOwnProduction(){ if(!ensureOpenWeek()) return; const w=currentWeek(), obj={}; $$('.own-qty').forEach(inp=>{const qty=int(inp.value);if(qty)obj[inp.dataset.pid]={qty,unitPrice:n(inp.dataset.price)};}); w.ownProduction=obj; saveState(false); render(); showToast('Producción propia guardada'); }

function renderPublic(){
  const w=currentWeek(), stock=stockByProduct(w), st=salesTotals(w), rows=Object.entries(stock).filter(([,q])=>q>0).sort((a,b)=>(product(a[0])?.name||'').localeCompare(product(b[0])?.name||'')).map(([pid,q])=>`<div class="list-item"><div class="grow"><strong>${esc(product(pid)?.name||'Postre')}</strong><small>Disponible para vender</small></div><div class="amount">${qtyFmt(q)}</div></div>`).join('');

  return `${hero('Venta al público','Registrá lo que realmente vendieron')}
    <div class="grid grid-2"><div class="card stat-card"><div><div class="eyebrow">Facturación real</div><div class="value">${money(st.money)}</div></div><div class="sub">${st.qty} postres vendidos</div></div><div class="card stat-card"><div><div class="eyebrow">Stock</div><div class="value">${Object.values(stock).reduce((s,q)=>s+Math.max(0,n(q)),0)}</div></div><div class="sub">postres disponibles</div></div></div>
    <div class="section"><div class="section-title"><h3>Stock actual</h3><button class="btn small primary" onclick="openSaleModal()">+ Venta</button></div><div class="list">${rows||'<div class="empty">No hay stock disponible.</div>'}</div></div>
    <div class="section"><div class="section-title"><h3>Ventas registradas</h3></div><div class="list">${sales||'<div class="empty">Todavía no registraste ventas.</div>'}</div></div>`;
}
function openSaleModal(){
  if(!ensureOpenWeek()) return;
  const stock=stockByProduct(), options=Object.entries(stock).filter(([,q])=>q>0).map(([pid,q])=>`<option value="${pid}">${esc(product(pid)?.name||'Postre')} · stock ${qtyFmt(q)}</option>`).join('');
  if(!options){showToast('No hay stock para vender');return;}
  modal('Registrar venta',`<div class="field"><label>Postre</label><select id="saleProduct" class="select" onchange="updateSalePrice()">${options}</select></div><div class="form-row"><div class="field"><label>Cantidad</label><input id="saleQty" class="input" type="number" min="1" step="1" value="1"></div><div class="field"><label>Precio unitario</label><input id="salePrice" class="input" type="number" min="0" step="100"></div></div><button class="btn primary wide" onclick="saveSale()">Guardar venta</button>`); updateSalePrice();
}
function updateSalePrice(){const p=product($('#saleProduct')?.value);if(p&&$('#salePrice'))$('#salePrice').value=priceOf(p,'public');}
function saveSale(){const w=currentWeek(), pid=$('#saleProduct').value, qty=int($('#saleQty').value), pr=n($('#salePrice').value), stock=n(stockByProduct(w)[pid]); if(qty<1)return showToast('Cantidad inválida'); if(qty>stock)return showToast(`Solo hay ${stock} en stock`); w.publicSales.push({id:uid('sale'),productId:pid,qty,unitPrice:pr,date:new Date().toISOString()}); saveState(false);closeModal();render();showToast('Venta registrada');}
function deleteSale(id){if(!confirm('¿Eliminar esta venta?'))return;const w=currentWeek();w.publicSales=w.publicSales.filter(s=>s.id!==id);saveState(false);render();showToast('Venta eliminada');}

function renderProductionMode(){
  const w=currentWeek(), prod=productionByProduct(w), rows=Object.entries(prod).filter(([,q])=>q>0).sort((a,b)=>(product(a[0])?.name||'').localeCompare(product(b[0])?.name||'')).map(([pid,q])=>{
    const st=w.productionStatus?.[pid]||'pending';
    return `<div class="progress-item"><div class="progress-item-head"><div class="name">${esc(product(pid)?.name||'Postre')}</div><div class="qty">${qtyFmt(q)}</div></div><div class="status-btns"><button class="pending ${st==='pending'?'active':''}" onclick="setProdStatus('${pid}','pending')">Pendiente</button><button class="doing ${st==='doing'?'active':''}" onclick="setProdStatus('${pid}','doing')">En producción</button><button class="done ${st==='done'?'active':''}" onclick="setProdStatus('${pid}','done')">Terminada</button></div></div>`;
  }).join('');
  return `${hero('Modo producción','Marcá el avance sin tocar los pedidos')}<div class="grid">${rows||'<div class="empty">No hay producción cargada.</div>'}</div>`;
}
function setProdStatus(pid,status){if(!ensureOpenWeek()) return; const w=currentWeek();w.productionStatus=w.productionStatus||{};w.productionStatus[pid]=status;saveState();}

function renderBusinesses(){
  const rows=state.businesses.filter(b=>b.active).map(b=>{
    const allOrders=state.weeks.flatMap(w=>w.orders.filter(o=>o.businessId===b.id)); const qty=allOrders.reduce((s,o)=>s+orderQtyTotal(o),0), amount=allOrders.reduce((s,o)=>s+orderMoney(o),0);
    return `<div class="list-item clickable" onclick="openBusinessModal('${b.id}')"><div class="grow"><strong>${esc(b.name)}</strong><small>${esc([b.city,b.contact].filter(Boolean).join(' · ')||'Sin datos extra')} · histórico ${qty} postres</small></div><div class="amount">${money(amount)}</div><span>›</span></div>`;
  }).join('');
  return `${hero('Negocios','Clientes que compran tus postres')}<div class="list">${rows||'<div class="empty"><div class="icon">🏪</div><strong>No hay negocios</strong><div>Agregá el primero.</div></div>'}</div><button class="fab" onclick="openBusinessModal()">＋ Nuevo negocio</button>`;
}
function openBusinessModal(id=''){
  const b=id?business(id):{};
  modal(id?'Editar negocio':'Nuevo negocio',`<div class="field"><label>Nombre *</label><input id="bName" class="input" value="${esc(b.name||'')}"></div><div class="form-row"><div class="field"><label>Ciudad</label><input id="bCity" class="input" value="${esc(b.city||'')}"></div><div class="field"><label>Contacto</label><input id="bContact" class="input" value="${esc(b.contact||'')}"></div></div><div class="field"><label>Teléfono</label><input id="bPhone" class="input" value="${esc(b.phone||'')}"></div><div class="field"><label>Dirección</label><input id="bAddress" class="input" value="${esc(b.address||'')}"></div><div class="field"><label>Observaciones</label><textarea id="bNotes" class="textarea">${esc(b.notes||'')}</textarea></div><div class="field"><label><input id="bActive" type="checkbox" ${b.active!==false?'checked':''}> Activo</label></div><div class="grid grid-2"><button class="btn primary" onclick="saveBusiness('${id}')">Guardar</button>${id?`<button class="btn ghost" onclick="deactivateBusiness('${id}')">Desactivar</button>`:'<button class="btn ghost" onclick="closeModal()">Cancelar</button>'}</div>`);
}
function saveBusiness(id=''){const name=$('#bName').value.trim();if(!name)return showToast('Escribí el nombre');const data={name,city:$('#bCity').value.trim(),contact:$('#bContact').value.trim(),phone:$('#bPhone').value.trim(),address:$('#bAddress').value.trim(),notes:$('#bNotes').value.trim(),active:$('#bActive').checked};if(id)Object.assign(business(id),data);else state.businesses.push({id:uid('biz'),...data});saveState(false);closeModal();render();showToast('Negocio guardado');}
function deactivateBusiness(id){business(id).active=false;saveState(false);closeModal();render();showToast('Negocio desactivado');}

function renderProducts(){
  const rows=state.products.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="list-item clickable" onclick="openProductModal('${p.id}')"><div class="grow"><strong>${esc(p.name)}</strong><small>Negocio ${money(priceOf(p,'business'))} · Público ${money(priceOf(p,'public'))} · ${(p.recipe||[]).length} ítems en receta</small></div><span>›</span></div>`).join('');
  const inactive=state.products.filter(p=>!p.active).length;
  return `${hero('Postres','Precios, recetas y nuevas variedades')}<div class="note">Podés crear postres nuevos desde acá. No hace falta tocar el código.</div><div class="section list">${rows}</div>${inactive?`<div class="section"><button class="btn ghost wide" onclick="showInactiveProducts()">Ver ${inactive} desactivados</button></div>`:''}<button class="fab" onclick="openProductModal()">＋ Nuevo postre</button>`;
}
function showInactiveProducts(){const rows=state.products.filter(p=>!p.active).map(p=>`<div class="list-item"><div class="grow"><strong>${esc(p.name)}</strong><small>Desactivado</small></div><button class="btn small" onclick="reactivateProduct('${p.id}')">Reactivar</button></div>`).join('');modal('Postres desactivados',`<div class="list">${rows}</div>`);}
function reactivateProduct(id){product(id).active=true;saveState(false);closeModal();render();showToast('Postre reactivado');}
function openProductModal(id=''){
  const p=id?product(id):{active:true,recipe:[]};
  modal(id?'Editar postre':'Nuevo postre',`<div class="field"><label>Nombre *</label><input id="pName" class="input" value="${esc(p.name||'')}"></div><div class="form-row"><div class="field"><label>Precio especial negocio</label><input id="pBizPrice" class="input" type="number" placeholder="Usar general" value="${p.businessPrice??''}"></div><div class="field"><label>Precio especial público</label><input id="pPubPrice" class="input" type="number" placeholder="Usar general" value="${p.publicPrice??''}"></div></div><div class="field"><label>Notas</label><textarea id="pNotes" class="textarea">${esc(p.notes||'')}</textarea></div><div class="field"><label><input id="pActive" type="checkbox" ${p.active!==false?'checked':''}> Activo</label></div><div class="section-title"><h3>Receta</h3><button class="btn small ghost" onclick="addRecipeRow()">+ Ingrediente</button></div><div id="recipeRows"></div><div class="note">Las cantidades de receta se cargan en g, ml o unidades según el ingrediente.</div><div class="grid grid-2 section"><button class="btn primary" onclick="saveProduct('${id}')">Guardar postre</button>${id?`<button class="btn ghost" onclick="deactivateProduct('${id}')">Desactivar</button>`:'<button class="btn ghost" onclick="closeModal()">Cancelar</button>'}</div>`);
  (p.recipe||[]).forEach(r=>addRecipeRow(r.ingredientId,r.qty));
  if(!(p.recipe||[]).length) addRecipeRow();
}
function ingredientOptions(selected=''){return state.ingredients.filter(i=>i.active || i.id===selected).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}" ${i.id===selected?'selected':''}>${esc(i.name)}</option>`).join('');}
function addRecipeRow(ingredientId='',qty=''){
  const box=$('#recipeRows'); if(!box)return; const row=document.createElement('div');row.className='recipe-row';
  row.innerHTML=`<select class="recipe-ing" onchange="updateRecipeUnit(this)"><option value="">Ingrediente...</option>${ingredientOptions(ingredientId)}</select><input class="recipe-qty" type="number" min="0" step="0.1" value="${qty}"><span class="badge gray recipe-unit">${ingredientId?baseUnit(ingredient(ingredientId)?.unit):'—'}</span><button class="close-btn" onclick="this.parentElement.remove()">−</button>`;box.appendChild(row);
}
function updateRecipeUnit(sel){const ing=ingredient(sel.value);$('.recipe-unit',sel.parentElement).textContent=ing?baseUnit(ing.unit):'—';}
function saveProduct(id=''){
  const name=$('#pName').value.trim();if(!name)return showToast('Escribí el nombre');
  const recipe=$$('#recipeRows .recipe-row').map(row=>({ingredientId:$('.recipe-ing',row).value,qty:n($('.recipe-qty',row).value)})).filter(r=>r.ingredientId&&r.qty>0);
  const biz=$('#pBizPrice').value.trim(), pub=$('#pPubPrice').value.trim();
  const data={name,businessPrice:biz===''?null:n(biz),publicPrice:pub===''?null:n(pub),notes:$('#pNotes').value.trim(),active:$('#pActive').checked,recipe};
  if(id)Object.assign(product(id),data); else state.products.push({id:uid('prod'),...data});
  saveState(false);closeModal();render();showToast('Postre guardado');
}
function deactivateProduct(id){product(id).active=false;saveState(false);closeModal();render();showToast('Postre desactivado');}

function renderIngredients(){
  const rows=state.ingredients.filter(i=>i.active).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="list-item clickable" onclick="openIngredientModal('${i.id}')"><div class="grow"><strong>${esc(i.name)}</strong><small>${money(i.purchasePrice)} / ${qtyFmt(i.purchaseQty)} ${i.unit==='unit'?'unidad(es)':i.unit} · ${money(ingredientCostPerBase(i))} por ${baseUnit(i.unit)}</small>${i.note?`<small>⚠️ ${esc(i.note)}</small>`:''}</div><span>›</span></div>`).join('');
  return `${hero('Materia prima','Actualizá un precio una sola vez')}<div class="list">${rows}</div><button class="fab" onclick="openIngredientModal()">＋ Ingrediente</button>`;
}
function openIngredientModal(id=''){
  const i=id?ingredient(id):{active:true,unit:'g'};
  modal(id?'Editar ingrediente':'Nuevo ingrediente',`<div class="field"><label>Nombre *</label><input id="iName" class="input" value="${esc(i.name||'')}"></div><div class="form-row"><div class="field"><label>Precio pagado</label><input id="iPrice" class="input" type="number" min="0" value="${i.purchasePrice??''}"></div><div class="field"><label>Cantidad comprada</label><input id="iQty" class="input" type="number" min="0" step="0.01" value="${i.purchaseQty??''}"></div></div><div class="field"><label>Unidad de compra</label><select id="iUnit" class="select"><option value="g" ${i.unit==='g'?'selected':''}>gramos</option><option value="kg" ${i.unit==='kg'?'selected':''}>kilogramos</option><option value="ml" ${i.unit==='ml'?'selected':''}>mililitros</option><option value="l" ${i.unit==='l'?'selected':''}>litros</option><option value="unit" ${i.unit==='unit'?'selected':''}>unidades</option></select></div><div class="field"><label>Nota</label><textarea id="iNote" class="textarea">${esc(i.note||'')}</textarea></div><div class="field"><label><input id="iActive" type="checkbox" ${i.active!==false?'checked':''}> Activo</label></div><div class="grid grid-2"><button class="btn primary" onclick="saveIngredient('${id}')">Guardar</button>${id?`<button class="btn ghost" onclick="deactivateIngredient('${id}')">Desactivar</button>`:'<button class="btn ghost" onclick="closeModal()">Cancelar</button>'}</div>`);
}
function saveIngredient(id=''){const name=$('#iName').value.trim();if(!name)return showToast('Escribí el nombre');const data={name,purchasePrice:n($('#iPrice').value),purchaseQty:n($('#iQty').value),unit:$('#iUnit').value,note:$('#iNote').value.trim(),active:$('#iActive').checked};if(id)Object.assign(ingredient(id),data);else state.ingredients.push({id:uid('ing'),...data});saveState(false);closeModal();render();showToast('Ingrediente guardado');}
function deactivateIngredient(id){ingredient(id).active=false;saveState(false);closeModal();render();showToast('Ingrediente desactivado');}

function renderShopping(){
  const totals=ingredientsNeeded(), rows=Object.entries(totals).filter(([,q])=>q>0).sort((a,b)=>(ingredient(a[0])?.name||'').localeCompare(ingredient(b[0])?.name||'')).map(([iid,q])=>{const ing=ingredient(iid);return `<div class="list-item"><div class="grow"><strong>${esc(ing?.name||'Ingrediente')}</strong><small>Según recetas y producción total</small></div><div class="amount">${smartQty(q,baseUnit(ing?.unit||'unit'))}</div></div>`;}).join('');
  return `${hero('Ingredientes necesarios','Calculado desde las recetas')}<div class="note">Si una receta está incompleta, esta lista también lo estará. Podés editar cualquier receta desde Postres.</div><div class="section list">${rows||'<div class="empty">No hay ingredientes para calcular.</div>'}</div><button class="btn primary wide section" onclick="copyShoppingList()">📋 Copiar lista</button>`;
}
function copyShoppingList(){const totals=ingredientsNeeded(), lines=['Lista de producción · Toque Dulce',''];Object.entries(totals).filter(([,q])=>q>0).sort((a,b)=>(ingredient(a[0])?.name||'').localeCompare(ingredient(b[0])?.name||'')).forEach(([iid,q])=>{const ing=ingredient(iid);lines.push(`• ${ing?.name||'Ingrediente'}: ${smartQty(q,baseUnit(ing?.unit||'unit'))}`);});copyText(lines.join('\n'));}

function renderHistory(){
  const rows=state.weeks.slice().sort((a,b)=>b.startDate.localeCompare(a.startDate)).map(w=>{const bt=businessTotals(w),st=salesTotals(w),prod=productionByProduct(w),q=Object.values(prod).reduce((a,b)=>a+n(b),0);return `<div class="list-item clickable" onclick="showWeekSummary('${w.id}')"><div class="grow"><strong>${esc(w.label)}</strong><small>${w.status==='open'?'Activa':'Cerrada'} · ${q} producidos · ${money(bt.money+st.money)} facturación real</small></div><span class="badge ${w.status==='open'?'ok':'gray'}">${w.status==='open'?'ACTIVA':'CERRADA'}</span><span>›</span></div>`;}).join('');
  return `${hero('Historial','Semanas y tandas anteriores')}<div class="toolbar"><button class="btn primary" onclick="openNewWeekModal()">＋ Nueva semana</button>${currentWeek()?.status==='open'?'<button class="btn ghost" onclick="closeCurrentWeek()">Finalizar semana</button>':''}</div><div class="list">${rows}</div>`;
}
function showWeekSummary(id){const w=state.weeks.find(x=>x.id===id);if(!w)return;const bt=businessTotals(w),ot=ownTotals(w),st=salesTotals(w),prod=productionByProduct(w),pq=Object.values(prod).reduce((a,b)=>a+n(b),0);const orders=w.orders.map(o=>`<div class="money-line"><span>${esc(business(o.businessId)?.name||'Negocio')} · ${orderQtyTotal(o)} postres</span><strong>${money(orderMoney(o))}</strong></div>`).join('');modal(w.label,`${orders||'<div class="empty">Sin pedidos de negocios.</div>'}<div class="divider"></div><div class="money-line"><span>Producción propia</span><strong>${ot.qty}</strong></div><div class="money-line"><span>Ventas al público</span><strong>${money(st.money)}</strong></div><div class="money-line"><span>Producción total</span><strong>${pq}</strong></div><div class="total-box section"><div class="label">Facturación real</div><div class="big">${money(bt.money+st.money)}</div></div>`);}
function weekHasActivity(w){
  if(!w)return false;
  const pedidos=(w.orders||[]).some(o=>(o.items||[]).some(item=>n(item.qty)>0));
  const produccion=Object.values(w.ownProduction||{}).some(item=>n(item?.qty)>0);
  const publico=(w.publicSales||[]).some(item=>n(item.qty)>0);
  return pedidos||produccion||publico;
}
function weekHasCostClose(id){
  try{return Boolean(JSON.parse(localStorage.getItem('toqueDulce_calculadoraCostos_v1'))?.cierres?.[id]);}
  catch(_){return false;}
}
function weekShouldClose(w){
  if(!w||w.status!=='open'||!weekHasActivity(w)||weekHasCostClose(w.id)||!w.startDate)return false;
  const inicio=new Date(`${w.startDate}T12:00:00`),hoy=new Date();
  return Number.isFinite(inicio.getTime())&&Math.floor((hoy-inicio)/86400000)>=6;
}
function openWeekClose(id){window.location.href='Costos.html?v=9&cerrar='+encodeURIComponent(id);}
function openNewWeekModal(){
  const activa=currentWeek();
  if(activa?.status==='open'&&weekHasActivity(activa)&&!weekHasCostClose(activa.id)){
    modal('Primero finalizá la semana',`<div class="note">Antes de crear otra semana, indicá cuántos postres quedaron. Así se guardan las ventas al público y la ganancia correcta sin mezclar semanas.</div><button class="btn primary wide section" onclick="openWeekClose('${activa.id}')">Finalizar ${esc(activa.label)}</button>`);
    return;
  }
  modal('Nueva semana',`<div class="field"><label>Fecha de inicio</label><input id="newWeekDate" class="input" type="date" value="${todayISO()}" onchange="$('#newWeekLabel').value=weekLabel(this.value)"></div><div class="field"><label>Nombre</label><input id="newWeekLabel" class="input" value="${esc(weekLabel())}"></div><button class="btn primary wide" onclick="createWeek()">Crear semana</button>`);
}
function createWeek(){
  const activa=currentWeek();
  if(activa?.status==='open'&&weekHasActivity(activa)&&!weekHasCostClose(activa.id)){closeModal();openWeekClose(activa.id);return;}
  const date=$('#newWeekDate').value||todayISO(),label=$('#newWeekLabel').value.trim()||weekLabel(date);
  state.weeks.filter(w=>w.status==='open').forEach(w=>w.status='closed');
  const id=uid('week');
  state.weeks.push({id,label,startDate:date,status:'open',orders:[],ownProduction:{},publicSales:[],productionStatus:{}});
  state.currentWeekId=id;saveState(false);closeModal();currentView='dashboard';render();showToast('Nueva semana creada');
}
function closeCurrentWeek(){
  const semana=currentWeek();if(!semana)return;
  if(!weekHasActivity(semana)){
    if(!confirm('Esta semana está vacía. ¿Querés cerrarla?'))return;
    semana.status='closed';saveState();showToast('Semana vacía cerrada');return;
  }
  openWeekClose(semana.id);
}

function renderSettings(){
  return `${hero('Configuración','Precios generales y datos')}<div class="card"><div class="field"><label>Precio general negocios</label><input id="setBiz" class="input" type="number" value="${state.settings.businessPrice}"></div><div class="field"><label>Precio general público</label><input id="setPub" class="input" type="number" value="${state.settings.publicPrice}"></div><button class="btn primary wide" onclick="saveSettings()">Guardar precios</button></div>
    <div class="section"><div class="section-title"><h3>Copia de seguridad</h3></div><div class="grid grid-2"><button class="btn ghost" onclick="exportBackup()">⬇️ Exportar datos</button><button class="btn ghost" onclick="$('#importFile').click()">⬆️ Importar datos</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></div>
    <div class="section"><div class="section-title"><h3>Instalar en iPhone</h3></div><div class="note">Abrí esta app desde Safari, tocá Compartir y elegí “Agregar a pantalla de inicio”. Después se abre como una app independiente.</div></div>
    <div class="section"><button class="btn danger wide" onclick="resetApp()">Restablecer datos de ejemplo</button></div>`;
}
function saveSettings(){state.settings.businessPrice=n($('#setBiz').value);state.settings.publicPrice=n($('#setPub').value);saveState();showToast('Precios generales actualizados');}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`toque-dulce-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Backup exportado');}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.products||!data.weeks)throw new Error();state=data;saveState(false);render();showToast('Backup importado');}catch(e){alert('El archivo no parece ser un backup válido de Toque Dulce.');}};r.readAsText(file);}
function resetApp(){if(!confirm('¿Restablecer toda la app? Esto elimina los datos actuales del dispositivo.'))return;state=seedState();saveState();showToast('Datos restablecidos');}

function renderMore(){
  const w=currentWeek(),avisoCierre=weekShouldClose(w)?`<div class="note" style="margin-bottom:12px"><strong>Semana pendiente de finalizar</strong><br>Completá el cierre para guardar la ganancia correcta.<button class="btn primary wide" style="margin-top:10px" onclick="openWeekClose('${w.id}')">Finalizar semana</button></div>`:'';
  return `${hero('Más','Administración de la app')}${avisoCierre}<div class="action-grid">
    ${action('💰','Ganancias','Resumen semanal y mensual',"window.location.href='Costos.html?v=9&vista=ganancias'",'profit')}
    ${action('🏪','Negocios','Agregar o editar clientes',"go('businesses')")}
    ${action('🍰','Postres','Crear nuevas variedades',"go('products')")}
    ${action('🥛','Materia prima','Precios e ingredientes',"go('ingredients')")}
    ${action('🛒','Lista ingredientes','Necesario para producir',"go('shopping')")}
    ${action('✅','Modo producción','Pendiente / haciendo / listo',"go('productionMode')")}
    ${action('🧮','Costos y recetas','Ingredientes y precios',"window.location.href='Costos.html?v=9'")}
    ${action('⚙️','Configuración','Precios y backups',"go('settings')")}
  </div>`;
}

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn)); }
loadState();
render();

</script>
</body>
</html>
